<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fibbage - Host</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/host.css">
  <link rel="stylesheet" href="css/host-animations.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="theme-title">
  <!-- Gradient + topographic line background (theme set by setTheme in theme.js) -->
  <div class="bg-layer"></div>

  <!-- Audio Controls (fixed position, bottom left) -->
  <div class="audio-controls">
    <button class="audio-toggle-button tape" id="musicToggleButton">🎵 Music</button>
    <button class="audio-toggle-button tape" id="sfxToggleButton">🔊 SFX</button>
  </div>

  <!-- Stage: fixed 1920x1080 canvas scaled to fit the window (see stageScaler.js) -->
  <div id="stage" class="stage">
    <!-- Room code lockup (top left of the stage, always visible) -->
    <div class="room-code-lockup" id="persistentRoomCodeBox">
      <div class="room-code-lockup-label">Room<br>Code</div>
      <div class="room-code-lockup-value" id="persistentRoomCode">----</div>
    </div>

    <div class="container">
      <!-- Lobby Screen -->
      <div id="lobbyScreen" class="lobby-screen active">
        <div class="lobby-left">
          <h1 id="gameTitle" class="lobby-title tape">Fibbage</h1>

          <div class="lobby-join">
            <div class="lobby-join-label tape tape--light">Join on your phone with code</div>
            <div class="room-code-display" id="roomCodeDisplay">----</div>
          </div>

          <div class="game-rules" id="gameRules"></div>
        </div>

        <div class="lobby-right">
          <!-- Question Package Selector -->
          <div class="package-selector" id="packageSelector">
            <div class="lobby-heading tape">Pick a question pack</div>
            <div class="package-cards" id="packageCards">
              <!-- Package cards will be dynamically inserted here -->
            </div>
          </div>

          <div class="lobby-players">
            <div class="lobby-heading tape" id="playerCount">Waiting for players…</div>
            <div class="players-grid" id="playersGrid"></div>
          </div>

          <button class="start-button tape tape-button" id="startButton" disabled>Everybody's in!</button>
        </div>
      </div>

      <!-- Game Screen -->
      <div id="gameScreen" class="game-screen">
        <div class="question-number" id="questionNumber">Question 1 of 8</div>
        <div class="timer-display" id="timerDisplay">30</div>
        <div class="question-display" id="questionDisplay"></div>

        <!-- Reading Phase -->
        <div id="readingPhase" class="reading-phase" style="display: none;">
          <div class="reading-progress-bar" id="readingProgressBar"></div>
          <div class="reading-message">Read the question...</div>
        </div>

        <!-- Submit Phase -->
        <div id="submitPhase" class="submit-phase" style="display: none;">
          <div class="submit-status" id="submitStatus">Players are submitting answers...</div>
          <div class="submit-checkmarks" id="submitCheckmarks"></div>
        </div>

        <!-- Voting Phase -->
        <div id="votingPhase" class="voting-phase" style="display: none;">
          <h2 style="font-size: 36px; margin-bottom: 30px;">Vote for the correct answer!</h2>
          <div class="voting-status" id="votingStatus">Players are voting...</div>
          <div class="voting-checkmarks" id="votingCheckmarks"></div>
          <div class="answers-grid" id="answersGrid"></div>
        </div>

        <!-- Results Phase -->
        <div id="resultsPhase" class="results-phase" style="display: none;">
          <!-- Results container will be dynamically created by resultsScreen.js -->
        </div>
      </div>

      <!-- Game Over Screen -->
      <div id="gameOverScreen" class="game-over-screen">
        <h1 style="font-size: 64px; margin-bottom: 20px;">Game Over!</h1>
        <div class="winner-celebration" id="winnerCelebration"></div>
        <div class="final-leaderboard" id="finalLeaderboard"></div>
        <button class="play-again-button" id="playAgainButton">Play Again</button>
      </div>

      <!-- Error Message -->
      <div class="error-message" id="errorMessage"></div>
    </div>
  </div>

  <!-- Multiplier Announcement Overlay -->
  <div id="multiplierOverlay" class="multiplier-overlay" style="display: none;">
    <div class="multiplier-content">
      <div class="multiplier-emojis" id="multiplierEmojis"></div>
      <div class="multiplier-subtitle" id="multiplierSubtitle"></div>
      <div class="multiplier-title" id="multiplierTitle"></div>
      <div class="multiplier-description" id="multiplierDescription"></div>
      <div class="multiplier-emojis" id="multiplierEmojisBottom"></div>
    </div>
    <div class="multiplier-particles" id="multiplierParticles"></div>
  </div>

  <!-- Audio Configuration (must load first) -->
  <script src="js/config.js"></script>
  <script src="js/shared/theme.js"></script>

  <!-- UI Utilities -->
  <script src="js/host/ui/uiUpdater.js"></script>
  <script src="js/host/ui/timer.js"></script>
  <script src="js/host/ui/gameMusic.js"></script>
  <script src="js/host/ui/soundEffects.js"></script>
  <script src="js/host/ui/multiplierAnnouncement.js"></script>
  <script src="js/host/ui/stageScaler.js"></script>

  <!-- Screen Modules -->
  <script src="js/host/screens/lobbyScreen.js"></script>
  <script src="js/host/screens/submitScreen.js"></script>
  <script src="js/host/screens/votingScreen.js"></script>
  <script src="js/host/screens/resultsScreen.js"></script>
  <script src="js/host/screens/gameOverScreen.js"></script>

  <!-- Socket Handlers -->
  <script src="js/host/socketHandlers.js"></script>

  <!-- Main Initialization -->
  <script src="js/host/hostMain.js"></script>
</body>
</html>
